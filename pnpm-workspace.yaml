packages:
  - "apps/*"
  - "packages/*"

# Product release versions stay locked without @changesets/cli.
# Internal workspace packages stay at 0.0.0 and are never bumped.
versioning:
  fixed:
    - ["etyon", "@etyon/desktop"]
  ignore:
    - "@etyon/i18n"
    - "@etyon/logger"
    - "@etyon/rpc"
    - "@etyon/ui"

catalog:
  "@heroui/react": ^3.2.4
  "@hugeicons/core-free-icons": ^4.2.2
  "@hugeicons/react": ^1.1.9
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^26.1.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  react: ^19.2.7
  react-dom: ^19.2.7
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  zod: ^4.4.3
  vite-plus: 0.3.2
  "@tanstack/react-table": ^9.1.2
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
blockExoticSubdeps: false
nodeLinker: hoisted
onlyBuiltDependencies:
  - "@heroui-pro/react"
  - "@zowe/secrets-for-zowe-sdk"
  - electron
  - electron-winstaller
  - esbuild
  - fs-xattr
  - macos-alias
  - msw
allowBuilds:
  "@heroui-pro/react": true
  "@zowe/secrets-for-zowe-sdk": true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  heroui-native-pro: true
  heroui-pro: true
  macos-alias: true
  msw: true
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.3.2"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.2"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.2"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.2"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.2"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.2"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.2"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.2"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.2"
  - vite-plus@0.3.2
