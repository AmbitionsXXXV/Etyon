packages:
  - "apps/*"
  - "packages/*"

# Product release versions stay locked without @changesets/cli.
# Internal workspace packages stay at 0.0.0 and are never bumped.
versioning:
  fixed:
    - ["etyon", "@etyon/desktop"]
  ignore:
    - "@etyon/i18n"
    - "@etyon/logger"
    - "@etyon/rpc"
    - "@etyon/ui"

catalog:
  "@heroui/react": ^3.2.6
  "@hugeicons/core-free-icons": ^4.3.5
  "@hugeicons/react": ^1.1.10
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^26.6.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  zod: ^4.6.5
  vite-plus: 1.0.0-rc.0
  "@tanstack/react-table": ^9.2.4
# HeroUI Pro exposes these peers only after its authenticated postinstall.
packageExtensions:
  "@heroui-pro/react@1.0.0-beta.10":
    peerDependencies:
      marked: ">=18.0.0"
      react-aria: ">=3.52.1"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
blockExoticSubdeps: false
nodeLinker: hoisted
onlyBuiltDependencies:
  - "@heroui-pro/react"
  - "@zowe/secrets-for-zowe-sdk"
  - electron
  - electron-winstaller
  - esbuild
  - fs-xattr
  - macos-alias
  - msw
allowBuilds:
  "@heroui-pro/react": true
  "@zowe/secrets-for-zowe-sdk": true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  heroui-native-pro: true
  heroui-pro: true
  macos-alias: true
  msw: true
